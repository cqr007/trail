  # 服务 2: 币安机器人 (新增)
  bn-bot:
    # 复用相同的构建上下文，Docker 会智能利用缓存，不用担心重复构建变慢
    build:
      context: .
      args:
        http_proxy: http://192.168.1.2:1080
        https_proxy: http://192.168.1.2:1080
    container_name: binance-test-bot
    restart: unless-stopped
    # ⚠️ 关键修改：覆盖 Dockerfile 的默认命令，指定运行 chua_bn.py
    command: python chua_bn.py
    volumes:
      - ./config.json:/app/config.json
      - ./logs:/app/logs
    environment:
      - TZ=Asia/Shanghai      
      - https_proxy=http://192.168.1.3:1080
      - http_proxy=http://192.168.1.3:1080
